<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Vérification de carte</title>
  <!--
    Site À PART https://verif-personnel.vercel.app (projet Vercel « verif-personnel »),
    ouvert par le QR au verso de la carte du travailleur (lib/carteTravailleur.js).
    Indépendant de l'application : si Samtrackly change d'hébergement, les
    cartes imprimées continuent de marcher. Adresse gravée sur les cartes :
    ne jamais supprimer ni renommer ce projet Vercel.
    Publier : cd verif-personnel && npx vercel deploy --prod --yes
    Lit uniquement verifier_carte(jeton) (supabase_cartes_travailleurs.sql),
    qui ne renvoie ni CNI, ni naissance, ni téléphone, ni salaire.
  -->
  <style>
    :root { --fond: #f2f2f5; --carte: #fff; --texte: #111; --doux: #6e6e73; --ligne: #e6e6ea; }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #0f0f10; --carte: #1c1c1e; --texte: #f2f2f2; --doux: #a1a1a6; --ligne: #2c2c2e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fond); color: var(--texte);
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    main { max-width: 440px; margin: 0 auto; padding: 20px 16px 40px; }
    .etat { border-radius: 20px; padding: 22px 18px; text-align: center; color: #fff; }
    .etat .ico { font-size: 44px; line-height: 1; }
    .etat h1 { margin: 10px 0 4px; font-size: 22px; }
    .etat p { margin: 0; font-size: 15px; opacity: .92; line-height: 1.4; }
    .ok { background: #1E9E5A; } .ko { background: #C0392B; } .attention { background: #D9822B; } .neutre { background: #7a7a80; }
    .fiche { margin-top: 14px; background: var(--carte); border-radius: 20px; overflow: hidden; border: 1px solid var(--ligne); }
    .bandeau { height: 8px; }
    .perso { display: flex; gap: 14px; align-items: center; padding: 16px; }
    .perso img, .perso .ini { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .perso .ini { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; font-weight: 800; }
    .nom { font-size: 19px; font-weight: 800; }
    .sous { color: var(--doux); font-size: 14px; margin-top: 3px; }
    .ligne { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--ligne); font-size: 14px; }
    .ligne span:first-child { color: var(--doux); }
    .ligne span:last-child { font-weight: 700; text-align: right; }
    .contact { margin-top: 16px; text-align: center; color: var(--doux); font-size: 14px; line-height: 1.6; }
    .contact a { display: inline-block; margin: 6px 6px 0; padding: 12px 16px; border-radius: 14px; background: var(--carte);
      border: 1px solid var(--ligne); color: var(--texte); font-weight: 800; font-size: 16px; text-decoration: none; }
    .heure { margin-top: 14px; text-align: center; color: var(--doux); font-size: 12px; }
  </style>
</head>
<body>
<main id="page">
  <div class="etat neutre"><div class="ico">⏳</div><h1>Vérification…</h1><p>Un instant.</p></div>
</main>
<script>
(function () {
  var URL_SUPABASE = 'https://wlwotzxnzowbkbfcpnyi.supabase.co'
  var CLE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indsd290enhuem93YmtiZmNwbnlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NjQ1OTEsImV4cCI6MjA5MTQ0MDU5MX0.nioXBAKA05_zRIyTpJmV_d4JY5mCYueOt5cKIlL-NNk'
  var NUMEROS = ['0143111118', '0779696370']
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre']

  var page = document.getElementById('page')
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
  function dateFr(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? parseInt(m[3], 10) + ' ' + MOIS[parseInt(m[2], 10) - 1] + ' ' + m[1] : '' }
  function tel(n) { return n.replace(/(\d{2})(?=\d)/g, '$1 ') }
  function couleur(c) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : c === 'vert' ? '#2D7D46' : '#EF9F27' }
  function miniature(url) {
    return /\/storage\/v1\/object\/public\//.test(url || '')
      ? url.replace('/storage/v1/object/public/', '/storage/v1/render/image/public/') + '?width=240&height=240&resize=cover'
      : url
  }

  function contacts(titre) {
    return '<div class="contact">' + titre + '<br>' + NUMEROS.map(function (n) {
      return '<a href="tel:' + n + '">📞 ' + tel(n) + '</a>'
    }).join('') + '</div>'
  }

  function afficher(classe, ico, titre, texte, d) {
    var h = '<div class="etat ' + classe + '"><div class="ico">' + ico + '</div><h1>' + titre + '</h1><p>' + texte + '</p></div>'
    if (d) {
      var c = couleur(d.couleur)
      var ini = String(d.nom || '').trim().split(/\s+/).map(function (x) { return x[0] || '' }).join('').slice(0, 2).toUpperCase()
      var photo = d.photo_url
        ? '<img src="' + esc(miniature(d.photo_url)) + '" onerror="this.onerror=null;this.src=\'' + esc(d.photo_url) + '\'" alt="">'
        : '<div class="ini" style="background:' + c + '">' + esc(ini) + '</div>'
      h += '<div class="fiche"><div class="bandeau" style="background:' + c + '"></div>' +
        '<div class="perso">' + photo + '<div><div class="nom">' + esc(d.nom) + '</div>' +
        '<div class="sous">' + esc(d.poste || '') + (d.restaurant ? ' · ' + esc(d.restaurant) : '') + '</div></div></div>' +
        // Validité affichée seulement si elle a un sens (carte valide ou expirée).
        (d.etat === 'valide' || d.etat === 'expiree'
          ? '<div class="ligne"><span>' + (d.etat === 'expiree' ? 'Expirée le' : 'Valable jusqu\'au') + '</span><span>' + esc(dateFr(d.valide_jusqua)) + '</span></div>'
          : '') + '</div>'
    }
    h += contacts(classe === 'ok' ? 'Une question ?' : 'Merci de garder la carte et de nous prévenir :')
    h += '<div class="heure">Vérifié le ' + new Date().toLocaleString('fr-FR') + '</div>'
    page.innerHTML = h
  }

  var jeton = new URLSearchParams(location.search).get('c') || ''
  if (!/^[0-9a-f-]{36}$/i.test(jeton)) {
    afficher('ko', '❌', 'Carte inconnue', 'Ce code ne correspond à aucune carte. Elle peut être fausse.')
    return
  }

  fetch(URL_SUPABASE + '/rest/v1/rpc/verifier_carte', {
    method: 'POST',
    headers: { apikey: CLE, Authorization: 'Bearer ' + CLE, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_jeton: jeton }),
  })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json() })
    .then(function (d) {
      if (!d) return afficher('ko', '❌', 'Carte inconnue', 'Ce code ne correspond à aucune carte. Elle peut être fausse.')
      if (d.etat === 'valide') return afficher('ok', '✅', 'Carte valide', 'Cette personne fait bien partie du personnel.', d)
      if (d.etat === 'parti') return afficher('ko', '❌', 'Ne fait plus partie du personnel', 'Cette carte n\'est plus valable.', d)
      if (d.etat === 'remplacee') return afficher('attention', '⚠️', 'Carte remplacée', 'Une nouvelle carte a été émise : celle-ci n\'est plus valable.', d)
      if (d.etat === 'expiree') return afficher('attention', '⚠️', 'Carte expirée', 'Cette carte a dépassé sa date de validité.', d)
      afficher('neutre', '❔', 'Vérification impossible', 'Réessayez dans un instant.')
    })
    .catch(function () {
      afficher('neutre', '📶', 'Vérification impossible', 'Pas de connexion internet. Réessayez dans un instant.')
    })
})()
</script>
</body>
</html>
